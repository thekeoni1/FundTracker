[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fundtracker"
version = "0.1.0"
description = "Local tracker for newly launched hedge funds from SEC EDGAR Form D filings."
requires-python = ">=3.12"
# Dependencies are pinned in requirements.txt and requirements-dev.txt, not here.
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 30
